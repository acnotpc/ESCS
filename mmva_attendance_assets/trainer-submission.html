<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMVA submission review</title><style>body{margin:0;background:#edf4f7;color:#17334d;font:16px system-ui}main{max-width:1000px;margin:24px auto;padding:28px;background:white;border-radius:18px}img{width:100px;height:100px;object-fit:contain}a{color:#116f83}p{line-height:1.6}.notice{padding:16px;background:#edf4f7;border-radius:10px}article{padding:18px 0;border-bottom:1px solid #d6e2e8}h2{font-size:18px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;line-height:1.6}button{font:inherit;padding:12px;border-radius:8px;border:0;background:#116f83;color:white;cursor:pointer}[hidden]{display:none!important}@media(max-width:650px){main{margin:0;padding:18px;border-radius:0}}@media print{button{display:none}}</style><main><img src="/attendance/logo.jpeg" alt="MMVA"><h1 id="title">Submission review</h1><p><a id="back" href="/attendance/trainer/review">Back to course review</a></p><p id="message" role="status">Loading the course submission…</p><section id="result" hidden><p id="details"></p><p class="notice">Read-only original answers for this course. Use the course review dashboard to record verification and follow-up actions. Only supplied answers are shown. Signature images and attachments require administrator review.</p><div id="answers"></div><button id="hide">Hide answers</button></section></main><script>
const $=id=>document.getElementById(id);function text(tag,t,parent){const e=document.createElement(tag);e.textContent=t;parent.append(e);return e}
$('hide').onclick=()=>{$('answers').replaceChildren();$('result').hidden=true;$('message').hidden=false;$('message').textContent='Answers hidden. Reload this page to view them again.'};
(async()=>{try{const q=new URLSearchParams(location.search),code=q.get('course'),form=q.get('form'),submission=q.get('submission');if(!code||!/^\d{1,20}$/.test(code))throw Error('Choose a submission from course review.');$('back').href='/attendance/trainer/review?course='+encodeURIComponent(code);const r=await fetch('/attendance/trainer/submission-data',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,form,submission}),cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(r.status===401?'Sign in through the trainer portal to view this submission.':d.detail||'The submission could not be retrieved.');$('title').textContent=d.title;$('details').textContent='Course ID '+d.course+' · Submitted '+d.submittedAt+' · Record '+d.submission;for(const a of d.answers){const box=text('article','',$('answers'));text('h2',a.question,box);text('pre',a.answer,box);}if(!d.answers.length)text('p','No displayable answers were supplied.',$('answers'));$('result').hidden=false;$('message').hidden=true}catch(err){$('message').textContent=err.message}})();
</script></html>
