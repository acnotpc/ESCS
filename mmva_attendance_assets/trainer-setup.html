<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Set up your MMVA trainer login</title><style>body{margin:0;background:#edf4f7;color:#17334d;font:17px system-ui}main{max-width:480px;margin:30px auto;background:white;padding:30px;border-radius:18px}img{width:120px;height:120px;object-fit:contain;display:block;margin:auto}label{display:block;font-weight:600;margin:18px 0 6px}input,button{box-sizing:border-box;width:100%;font:inherit;padding:14px;border-radius:8px}input{border:1px solid #8ca4b3}button{border:0;background:#116f83;color:white;margin-top:24px}p{line-height:1.5}#message{padding:12px;background:#edf4f7}[hidden]{display:none!important}</style><main><img src="/attendance/logo.jpeg" alt="MMVA"><h1>Set up your trainer login</h1><p>Choose your password once. Then use the standard trainer QR to sign in and select your course.</p><p id="message" role="status" hidden></p><form id="setup"><label for="password">New password</label><input id="password" type="password" minlength="15" required autocomplete="new-password"><label for="confirm">Confirm password</label><input id="confirm" type="password" minlength="15" required autocomplete="new-password"><p>Use at least 15 characters. Spaces and passphrases are welcome.</p><button id="save">Create my trainer login</button></form><p id="done" hidden><a href="/attendance/trainer">Sign in and choose your course</a></p></main><script>
let token=new URLSearchParams(location.hash.slice(1)).get('token')||'';history.replaceState(null,'','/attendance/trainer/setup');const $=id=>document.getElementById(id);function message(s){$('message').textContent=s;$('message').hidden=false}if(!token){message('Open the personal setup link supplied by your administrator.');$('setup').hidden=true}
$('setup').onsubmit=async e=>{e.preventDefault();if($('password').value!==$('confirm').value){message('The passwords do not match.');return}$('save').disabled=true;try{const r=await fetch('/attendance/trainer/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:$('password').value}),cache:'no-store'});const c=await r.json();if(!r.ok)throw Error(c.detail||'Setup could not be completed.');token='';$('password').value='';$('confirm').value='';$('setup').hidden=true;$('done').hidden=false;message('Your trainer login is ready. Sign in with '+c.email+'.')}catch(err){message(err.message)}finally{$('save').disabled=false}};
</script></html>
