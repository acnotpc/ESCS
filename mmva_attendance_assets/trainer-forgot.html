<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Forgot your MMVA trainer password</title><style>body{margin:0;background:#edf4f7;color:#17334d;font:17px system-ui}main{max-width:480px;margin:30px auto;background:white;padding:30px;border-radius:18px}img{width:120px;height:120px;object-fit:contain;display:block;margin:auto}label{display:block;font-weight:600;margin:18px 0 6px}input,button{box-sizing:border-box;width:100%;font:inherit;padding:14px;border-radius:8px}input{border:1px solid #8ca4b3}button{border:0;background:#116f83;color:white;margin-top:24px}p{line-height:1.5}#message{padding:12px;background:#edf4f7}[hidden]{display:none!important}</style><main><img src="/attendance/logo.jpeg" alt="MMVA"><h1>Forgot your password?</h1><p>Enter your trainer email address. If you have an enabled account, we will email you a secure link to set a new password.</p><p id="message" role="status" aria-live="polite" hidden></p><form id="forgot"><label for="email">Trainer email address</label><input id="email" type="email" required maxlength="254" autocomplete="username"><button id="send">Email me a reset link</button></form><p><a href="/attendance/trainer">Back to trainer sign in</a></p></main><script>
const $=id=>document.getElementById(id);$('forgot').onsubmit=async e=>{e.preventDefault();$('send').disabled=true;try{const r=await fetch('/attendance/trainer/forgot',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value}),cache:'no-store'});const c=await r.json();if(!r.ok)throw Error(c.detail||'Please try again later.');$('message').textContent=c.message;$('forgot').hidden=true}catch(err){$('message').textContent=err.message}finally{$('message').hidden=false;$('send').disabled=false}};
</script></html>
