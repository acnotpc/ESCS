name: Application intake regression tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/intake-staff-selections-20261025]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -p 'test_*.py'
        env:
          HR_FOLLOWUP_EXTENDED_FORMS: 'true'
