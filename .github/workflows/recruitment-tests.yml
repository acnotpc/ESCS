name: Recruitment regression tests
on:
  push:
    branches:
      - fix/hr-followup-parallel-review-20261025
  pull_request:
    branches:
      - main
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run recruitment tests
        env:
          HR_FOLLOWUP_EXTENDED_FORMS: 'true'
        run: python -m unittest discover -p 'test_*.py'
